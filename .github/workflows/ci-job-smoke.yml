name: RA6 manual demo

on:
  workflow_dispatch:
    inputs:
      booking_id:
        description: 'Optional active RA6 booking ID; blank creates and releases a CI booking'
        type: string
        required: false

permissions:
  contents: read

# One physical RA6: serialize all four demo branches. Never cancel a running flash.
concurrency:
  group: ecw-ra6-board-23
  cancel-in-progress: false

env:
  ECW_BACKEND_URL: ${{ vars.ECW_BACKEND_URL || 'https://plovdiv.edgebench.io/api' }}
  ECW_CONSOLE_URL: ${{ vars.ECW_CONSOLE_URL || 'wss://plovdiv.edgebench.io' }}
  ECW_BOOKING_ID: ${{ inputs.booking_id }}

jobs:
  demo:
    name: Build and test RA6
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check required ECW configuration before building
        env:
          ECW_API_KEY: ${{ secrets.ECW_API_KEY }}
        run: |
          if [ -z "$ECW_API_KEY" ]; then
            echo "::error::Add the ECW_API_KEY repository Actions secret before running a live demo."
            exit 1
          fi
          case "$ECW_BACKEND_URL" in
            https://*) ;;
            *) echo "::error::ECW_BACKEND_URL must use HTTPS."; exit 1 ;;
          esac
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build gperf device-tree-compiler ccache xz-utils file make gcc g++
          python -m pip install -r requirements-ci.txt
      - name: Check demo contracts without hardware
        run: python -m unittest discover -s tests -v
      - name: Initialize pinned Zephyr workspace
        run: |
          west init -l .
          west update --narrow -o=--depth=1
          python -m pip install -r ../zephyr/scripts/requirements.txt
          west zephyr-export
          west sdk install --version 0.17.2 --toolchains arm-zephyr-eabi --install-dir "$RUNNER_TEMP/zephyr-sdk-0.17.2"
          echo "ZEPHYR_SDK_INSTALL_DIR=$RUNNER_TEMP/zephyr-sdk-0.17.2" >> "$GITHUB_ENV"
          echo "ZEPHYR_BASE=$(realpath ../zephyr)" >> "$GITHUB_ENV"
      - name: Build RA6 firmware (Twister branch also performs build-only discovery)
        run: bash .github/user/build/build.sh
      - name: Configure HIL if needed, upload, explicitly flash, test and release
        env:
          ECW_API_KEY: ${{ secrets.ECW_API_KEY }}
        run: python .github/scripts/run_demo.py
      - name: Release a booking created by this run (fallback after interruption)
        if: always()
        env:
          ECW_API_KEY: ${{ secrets.ECW_API_KEY }}
        run: |
          if [ -f artifacts/reservation.json ] && [ ! -f artifacts/release.json ]; then
            python .github/scripts/run_demo.py --release-only
          fi
      - name: Publish firmware and test evidence from this runner
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ra6-hil-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/firmware.hex
            build/zephyr/zephyr/zephyr.elf
            build/provenance.json
            build/twister/twister.json
            build/twister/twister.xml
            artifacts/
          if-no-files-found: warn
